[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-resolution-audit"
version = "1.0.0"
description = "Production-grade passive Linux network resolution auditor for ARP/neighbor table and DNS baseline monitoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "dshyleshkarthik7-hue" }
]
keywords = [
    "network",
    "security",
    "arp",
    "dns",
    "audit",
    "baseline",
    "neighbor-table",
    "defensive",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "dnspython>=2.6,<3",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-setuptools",
]
alerting = [
    "requests>=2.31",
]

[project.scripts]
network-resolution-audit = "network_resolution_audit.cli:main"
nra = "network_resolution_audit.cli:main"

[project.urls]
Homepage = "https://github.com/dshyleshkarthik7-hue/network-resolution-audit"
Repository = "https://github.com/dshyleshkarthik7-hue/network-resolution-audit"
Issues = "https://github.com/dshyleshkarthik7-hue/network-resolution-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/network_resolution_audit"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["network_resolution_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=network_resolution_audit --cov-report=term-missing"
pythonpath = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-setuptools",
    "types-requests",
]
alerting = [
    "requests>=2.31",
]